[package]
name = "flax-derive"
authors = ["Tei Leelo Roberts <ten3roberts@gmail.com>"]
version = "0.8.0"
description = "Derive macros for flax"
edition = "2021"
documentation = "https://docs.rs/flax"
repository = "https://github.com/ten3roberts/flax"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5"
syn = { version = "3.0", features = ["parsing", "full", "extra-traits"] }
quote = "1.0.47"
itertools = "0.15.0"
heck = "0.5"

[dev-dependencies]
glam = "0.33"
pretty_assertions = "1.4.0"
